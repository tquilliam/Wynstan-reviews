<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Wynstan — Reviews Dashboard</title>

<!--
  ============================================================================
  SETUP (one-time)
  ----------------------------------------------------------------------------
  1. In the Google Sheet:  File > Share > Publish to web
       - Publish the "All Reviews" tab as CSV  -> paste into CONFIG.csvUrl
       - Publish the "Staff" tab as CSV        -> paste into CONFIG.staffCsvUrl
  2. Commit index.html to a GitHub repo, then Settings > Pages > deploy from
     the main branch. Your dashboard is the Pages URL.

  Note: this is an INTERNAL tool. GitHub Pages + a published CSV are public to
  anyone who has the link — keep the URL private. (noindex is set above so it
  won't show up in Google.)
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #da487e;          /* Wynstan pink (primary accent) */
    --red-dark: #a7144c;     /* Wynstan deep berry */
    --dark: #27251f;         /* Wynstan charcoal — header / ink */
    --navy: #27251f;
    --ink: #27251f;
    --muted: #736c67;        /* warm grey */
    --line: #e8e6e5;
    --soft: #f4efec;
    --card: #ffffff;
    --page: #f7f5f5;
    --good: #16a34a;
    --star: #f5a623;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Roboto", system-ui, -apple-system, Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }

  header.top { background: var(--dark); color: #fff; }
  .top-inner { max-width: 1180px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .wordmark { font-weight: 900; font-size: 28px; letter-spacing: 1px; line-height: 1; text-transform: uppercase; }
  .wordmark span { color: var(--red); }
  .brand small { display: block; font-size: 12px; letter-spacing: 2px; color: #cfc9c4; text-transform: uppercase; margin-top: 5px; }
  .subtitle { font-size: 14px; color: rgba(255,255,255,.8); }
  .top a.sheet { display: inline-flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.35); padding: 8px 14px; border-radius: var(--radius); font-size: 14px; }
  .top a.sheet:hover { background: rgba(255,255,255,.1); }

  .section-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 28px 0 10px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 22px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-size: 30px; font-weight: 700; color: var(--dark); margin-top: 4px; }
  .kpi .value small { font-size: 14px; color: var(--muted); font-weight: 400; }

  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
  @media (max-width: 780px) { .grid-2 { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .srow .nm { width: 120px; font-size: 14px; }
  .srow .track { flex: 1; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .srow .fill { display: block; height: 100%; border-radius: 6px; }
  .srow .num { font-size: 13px; color: var(--muted); width: 92px; text-align: right; }

  .rrow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .rrow .rk { width: 30px; font-size: 13px; color: var(--muted); }
  .rrow .track { flex: 1; height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .rrow .num { width: 70px; text-align: right; font-size: 13px; color: var(--muted); }

  table.staff { width: 100%; border-collapse: collapse; }
  table.staff td { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  table.staff tr:last-child td { border-bottom: 0; }
  table.staff .cnt { text-align: right; color: var(--red); font-weight: 600; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 16px; }
  .filters select, .filters input {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; color: var(--ink);
  }
  .filters input { flex: 1; min-width: 200px; }

  .review { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .review.flag { background: #fff5f6; border-color: #f7c9d2; }
  .review .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 500; }
  .b-google { background: #e6f1fb; color: #0c447c; }
  .b-trustpilot { background: #e1f5ee; color: #0f6e56; }
  .b-productreview { background: #fadfd4; color: #8a3316; }
  .b-showroom { background: var(--soft); color: var(--navy); }
  .stars { color: var(--star); font-size: 13px; letter-spacing: 1px; }
  .review .who { font-size: 13px; color: var(--muted); }
  .review .staff { margin-left: auto; font-size: 12.5px; color: var(--red-dark); display: inline-flex; align-items: center; gap: 5px; }
  .review .body { font-size: 14.5px; line-height: 1.55; }
  .review .reply { margin-top: 8px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13.5px; }

  .matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  table.matrix { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  table.matrix th, table.matrix td { padding: 9px 12px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
  table.matrix thead th { background: var(--dark); color: #fff; font-weight: 500; }
  table.matrix th.sticky-col, table.matrix td.sticky-col { position: sticky; left: 0; text-align: left; background: #fff; font-weight: 500; min-width: 160px; z-index: 1; }
  table.matrix thead th.sticky-col { background: var(--dark); z-index: 2; }
  table.matrix td.tot, table.matrix th.tot { font-weight: 600; color: var(--red); background: var(--soft); }
  table.matrix tbody tr:last-child td { border-bottom: 0; }
  table.matrix td.hit { color: var(--dark); font-weight: 500; }
  table.matrix td.avg-hi { color: var(--good); font-weight: 600; }
  table.matrix td.avg-mid { color: #c98a00; font-weight: 600; }
  table.matrix td.avg-lo { color: var(--red); font-weight: 600; }
  table.matrix th.sortable { cursor: pointer; user-select: none; }
  table.matrix th.sortable:hover { color: #ffd; }
  table.matrix td.l { text-align: left; }

  .viewbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #fff; }
  .seg button { font: inherit; font-size: 13px; padding: 8px 18px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--red); color: #fff; }
  .viewbar .hint { font-size: 13px; color: var(--muted); }
  .pick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .pick select { font: inherit; font-size: 13px; color: var(--ink); padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .viewbar .hint { flex-basis: 100%; }
  .kpi .value.pos { color: var(--good); }
  .kpi .value.neg { color: var(--red); }

  .theme-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .theme-bar .hint { font-size: 13px; color: var(--muted); }
  table.matrix tr.theme-row { cursor: pointer; }
  table.matrix tr.theme-row:hover td.sticky-col { text-decoration: underline; }
  table.matrix td.trend { font-weight: 600; }
  .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 1px 8px; }

  .muted { color: var(--muted); }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
  a.rev-link { color: var(--red); text-decoration: none; font-size: 12.5px; }
  .foot { margin-top: 36px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .chart-wrap { position: relative; width: 100%; height: 240px; }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <div class="wordmark">WYN<span>STAN</span></div>
        <small>Blinds · Curtains · Shutters · Awnings · Crimsafe</small>
      </div>
      <div class="subtitle">Reviews dashboard</div>
    </div>
    <div style="text-align:right;">
      <a class="sheet" id="sheetLink" href="#" target="_blank" rel="noopener">Open Google Sheet ↗</a>
      <div class="subtitle" id="updated" style="margin-top:6px;"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="content" class="loading">Loading reviews…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const CONFIG = {
  // 1) Published "All Reviews" tab CSV.
  csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-1uGKZHQmLB4UysFIsWfpuiX9bdmu8av6_vw1L-bDt_hpoQICZ4nndrsLD8QktgMLEsY63b7uNsKz/pub?gid=2022928861&single=true&output=csv',
  // 2) Published "Staff" tab CSV — classifies Installers vs Sales reps.
  staffCsvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-1uGKZHQmLB4UysFIsWfpuiX9bdmu8av6_vw1L-bDt_hpoQICZ4nndrsLD8QktgMLEsY63b7uNsKz/pub?gid=1672934192&single=true&output=csv',
  // 3) The Wynstan reviews Google Sheet.
  sheetUrl: 'https://docs.google.com/spreadsheets/d/1u4ZSU4R_l9WE1XKZukHmWomvuGbIkLcD0TG_-CNNPS8/edit',
};

const SOURCE_COLORS = { Google: '#2a78d6', Trustpilot: '#199e70', ProductReview: '#da487e' };
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = (n) => n.toLocaleString('en-AU');
const monthKey = (d) => { const m = String(d || '').match(/(\d{4})-(\d{2})/); if (m) return m[1] + '-' + m[2]; const dt = new Date(d); return isNaN(dt) ? '' : dt.toISOString().slice(0, 7); };
// Weeks run Monday–Sunday and are keyed by their Monday (YYYY-MM-DD, local time).
const ymd = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const weekKey = (d) => { const dt = new Date(d); if (isNaN(dt)) return ''; return ymd(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - (dt.getDay() + 6) % 7)); };
const GRAINS = {
  month: { key: monthKey, noun: 'month', pick: 'Month',
    label: (k) => { const [y, m] = k.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: '2-digit' }); },
    long: (k) => { const [y, m] = k.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }); },
    shift: (k, n) => { const [y, m] = k.split('-'); return monthKey(ymd(new Date(y, m - 1 + n, 1))); },
    current: () => monthKey(ymd(new Date())),
    // every month of year y up to the current one, newest first
    inYear: (y) => { const out = [], cur = GRAINS.month.current(); for (let m = 12; m >= 1; m--) { const k = y + '-' + String(m).padStart(2, '0'); if (k <= cur) out.push(k); } return out; } },
  week: { key: weekKey, noun: 'week', pick: 'Week commencing',
    label: (k) => 'w/c ' + new Date(k + 'T00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }),
    long: (k) => 'Mon ' + new Date(k + 'T00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }),
    shift: (k, n) => { const d = new Date(k + 'T00:00'); return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7 * n)); },
    current: () => weekKey(new Date()),
    // every Monday that falls in year y, up to the current week, newest first
    inYear: (y) => { const out = [], cur = GRAINS.week.current(); const d = new Date(y, 0, 1); d.setDate(1 + (8 - d.getDay()) % 7);
      for (; d.getFullYear() === Number(y); d.setDate(d.getDate() + 7)) { const k = ymd(d); if (k <= cur) out.push(k); } return out.reverse(); } },
};
const PERIODS = 12;
// The selected month/week (null = the current one). Charts show the PERIODS ending with it.
const SEL = { month: null, week: null };
const anchor = (grain) => SEL[grain] || GRAINS[grain].current();
const lastPeriods = (grain) => Array.from({ length: PERIODS }, (_, i) => GRAINS[grain].shift(anchor(grain), i - PERIODS + 1));
// Review themes: keyword rules over title + text. A review can match several themes.
// To tune, edit a pattern here (and the same list in the other brand's dashboard).
const THEMES = [
  ['Timeliness & delays', /delay|took (over |nearly |almost )?(\d+|a few|several|two|three|four|five|six|eight|ten) (weeks?|months?)|\d+ ?(weeks?|months?) (later|wait|late|behind)|still (waiting|no |not )|wait(ed|ing)? (over |for |nearly |almost )?(\d+|weeks|months|two|three|four|five|six)|weeks? late|behind schedule|long wait|waiting (game|list|forever)|on time|ahead of schedule|sooner than|earlier than expected|quick turnaround|fast turnaround|in no time|very prompt|promptly|lead ?time|not until|waited all day/i],
  ['No-shows & rescheduling', /no.?show|did(n'?t| not) (turn up|show|arrive|come)|never (turned up|showed|arrived|came)|(no one|nobody) (turn(ed)? up|show(ed)? up|came|rocks? up)|reschedul|cancel+ed (the |my |our )?(appointment|install|booking)|time slot|(took|take|taken) (time|a day|the day) off work/i],
  ['Communication & follow-up', /communicat|follow.?up|call(ed)? (me |us )?back|return(ed)? (my |our )?calls?|no (one )?(response|reply|answer)|never heard|kept (me |us )?(informed|updated|in the loop)|\bupdates?\b|respon(d|ded|se|sive)\b|ignor(ed|ing)|chas(e|ed|ing)\b|unanswered|pick up the phone|get in touch|never (rang|called|contacted)/i],
  ['Installation & fitters', /installer|fitter|technician|workmanship|crooked|not straight|uneven|install(ation|ed)? (was|were)? ?(poor|poorly|badly|wrong|perfect|perfectly|beautifully|neatly|seamless)|damag(ed|e|ing) (to )?(the |my |our )?(wall|floor|paint|skirting|door|frame|window)|clean(ed)? up|tidy|neat\b|installation team|install team/i],
  ['Measure & order accuracy', /measur(ed|ement|ements)? (was |were )?(wrong|incorrect|incorrectly|wrongly)|(wrong|incorrect)(ly)? measur|wrong (colou?r|size|product|fabric|blind|item|one)|incorrect|(made a|due to a|their|his|her|an? admin|clerical) (mistake|error)|mistakes? (was|were) made|re.?order|re.?made|didn'?t fit|does(n'?t| not) fit|too (short|long|small|big|narrow|wide)|missing|omitted|not what (i|we) (ordered|asked)|check measure/i],
  ['Product quality & faults', /quality|fault|defect|broke|broken|fell (apart|down|off)|falling (apart|down|off)|flimsy|stopped working|malfunction|snap+ed|durable|sturdy|well made|look(s|ing)? (great|amazing|fantastic|beautiful|lovely|good|fabulous)|beautiful|stunning|love (them|our|the|it)/i],
  ['After-sales, repairs & warranty', /warranty|repair|after.?sales?|call.?out fee|service (call|fee|team)|replac|complain|resolv|resolution|refund/i],
  ['Sales experience & pressure', /sales ?(rep|person|man|woman|lady|girl|guy|consultant|team|staff)|consultant|pushy|pressur|hard sell|upsell|misquot|sign (up )?on the (day|spot)/i],
  ['Price & value', /\bprice|pric(ed|ing)|expensive|overpriced|\bvalue\b|\bcosts?\b|afford|\bcheap(er|est)?\b|discount|good deal|waste of money|rip.?off/i],
  ['Staff attitude & professionalism', /friendly|polite|courteous|rude|professional|helpful|unhelpful|knowledgeable|attitude|patient|arrogant|dismissive|condescending|respectful|lovely (lady|man|guy|person|team)/i],
];
const themesOf = (r) => { const t = (r.Title || '') + ' ' + (r.Review || ''); return THEMES.filter(([, rx]) => rx.test(t)).map(([n]) => n); };
let THEME_POL = 'neg', THEME_MODE = 'count';
let GRAIN = 'month';
try { if (localStorage.getItem('reviewsGrain') === 'week') GRAIN = 'week'; } catch (e) {}
const dateVal = (d) => { const t = new Date(d).getTime(); return isNaN(t) ? 0 : t; };
const stars = (r) => '★★★★★☆☆☆☆☆'.slice(5 - Math.round(num(r)), 10 - Math.round(num(r)));
const splitNames = (s) => String(s == null ? '' : s).split(',').map((x) => x.trim()).filter(Boolean);
// Words in the manual box that mean "nobody — clear the auto guess".
const NONE_TAGS = new Set(['none', 'no one', 'noone', 'nobody', 'n/a', 'na', '-', 'x']);
// The manual box OVERRIDES the auto "Staff Mentioned" guess for a review:
//   blank  -> keep the auto match
//   name(s)-> replace the auto match (list everyone for this row, comma-separated)
//   "none" -> clear it (auto was a false match; nobody is credited)
const staffUnion = (r) => {
  const man = splitNames(r['Staff (manual)']);
  if (man.length) {
    if (man.length === 1 && NONE_TAGS.has(man[0].toLowerCase())) return [];
    return [...new Set(man)];
  }
  return [...new Set(splitNames(r['Staff Mentioned']))];
};

// Wynstan fitters/installers (fallback classifier; the Staff CSV overrides this when published)
const INSTALLERS = new Set(['Chris Sun','John McKenna','Alexander Dinallo','Bill Barake','Simon Millard','Ryan Orley','Ronald Alosio','Adam Ivicak','Daniel Dimitriou','Nicholas Bond','Bobby Parker','Bruce Li','Paul Yankoff','Juan Humphreys','Karl Fritsch','Jay Kemp','Mahir Celikovic','Michael Johnson',"Michael D'Sylva",'Luke Medhurst','Michael Johannsen','Jayanath Wijayaweera','Mal Silva','Mansoor Haq','George Plionis','Joshua Agha','Piri Keenan','Andrew Molodstov','David Eddy','Darko Maracic','Arthur Chen','Ayden Richards','Brenton Barbeau','Song Lin','John Zhong','Chetan Prasad','Delfino Lanati','Mazen El Moussa','Garrath Burke-Weigt','Hakan Mehmet','Nader Nashabe','Mark Hogan','Chris Bridekirk','Kelvin Chan','Jay He','Kris McClelland','Brett Knight','Peter Hsu','Mick Issa','Aleksander Stojanovski','Nathan Osborne','Tom Vezos','Ronald Chand','Theo Stavrianos','Sam Khan','Mario Weitzel','Thomas Yorke','Billal El-Sayed','Steven Scuglia','Ali Hijazi','Taylor Sanderson','Thomas Hennessy','Mohammed Shamim','Richard Daher']);
const ROLE = {};  // filled from the Staff CSV (name -> role); falls back to INSTALLERS set
const roleOf = (n) => {
  const r = ROLE[n];
  if (r) return /install|fitt/i.test(r) ? 'installer' : 'rep';
  return INSTALLERS.has(n) ? 'installer' : 'rep';
};

$('#sheetLink').href = CONFIG.sheetUrl;

let ALL = [];

function loadReviews() {
  Papa.parse(CONFIG.csvUrl, {
    download: true, header: true, skipEmptyLines: true,
    complete: (res) => { ALL = res.data.filter((r) => r.Source); ALL.forEach((r) => { r._staff = staffUnion(r); r._themes = themesOf(r); }); render(); },
    error: (err) => { $('#content').innerHTML = '<div class="loading">Couldn\'t load the sheet CSV.<br>Check CONFIG.csvUrl and that the tab is published to the web.<br><span class="muted">' + esc(err.message || err) + '</span></div>'; },
  });
}

if (CONFIG.staffCsvUrl && !/PASTE_/.test(CONFIG.staffCsvUrl)) {
  Papa.parse(CONFIG.staffCsvUrl, {
    download: true, header: true, skipEmptyLines: true,
    complete: (s) => { s.data.forEach((row) => { const n = String(row.Name || '').trim(); if (n) ROLE[n] = String(row.Role || '').trim(); }); loadReviews(); },
    error: () => loadReviews(),
  });
} else {
  loadReviews();
}

let shSort = { key: 'count', dir: -1 };

function render() {
  if (!ALL.length) { $('#content').innerHTML = '<div class="loading">No reviews found.</div>'; return; }

  const total = ALL.length;
  const avg = (ALL.reduce((s, r) => s + num(r.Rating), 0) / total) || 0;
  const showrooms = [...new Set(ALL.map((r) => (r.Showroom || '').trim()).filter(Boolean))].sort();

  const bySource = {};
  ALL.forEach((r) => { const s = r.Source || 'Other'; (bySource[s] = bySource[s] || []).push(num(r.Rating)); });

  const dist = [0, 0, 0, 0, 0];
  ALL.forEach((r) => { const k = Math.round(num(r.Rating)); if (k >= 1 && k <= 5) dist[k - 1]++; });

  const staff = {};
  ALL.forEach((r) => r._staff.forEach((n) => { staff[n] = (staff[n] || 0) + 1; }));
  const topStaff = Object.entries(staff).sort((a, b) => b[1] - a[1]).slice(0, 8);

  const lastCap = ALL.map((r) => r['Captured At']).filter(Boolean).sort().pop();
  $('#updated').textContent = lastCap ? 'Updated ' + new Date(lastCap).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

  $('#content').classList.remove('loading');
  $('#content').innerHTML = `
    <div class="viewbar">

// Everything that changes with the Monthly / Weekly toggle and the period pickers.
function renderPeriod() {
  const g = GRAINS[GRAIN];
  const keys = lastPeriods(GRAIN);
  const counts = {}, fives = {}, stat = {};   // stat: period -> { n, sum, pos, neg }
  ALL.forEach((r) => {
    const k = g.key(r.Date); if (!k) return;
    counts[k] = (counts[k] || 0) + 1;
    const rt = num(r.Rating);
    if (Math.round(rt) === 5) fives[k] = (fives[k] || 0) + 1;
    if (!rt) return;
    const s = stat[k] || (stat[k] = { n: 0, sum: 0, pos: 0, neg: 0 });
    s.n++; s.sum += rt;
    if (rt >= 4) s.pos++; else s.neg++;
  });
  const cur = keys[keys.length - 1], prev = keys[keys.length - 2];
  const sc = stat[cur] || { n: 0, sum: 0, pos: 0, neg: 0 }, sp = stat[prev] || { n: 0, sum: 0, pos: 0, neg: 0 };
  const isLive = cur === g.current();

  $('#grainSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.g === GRAIN));
  // Year picker: first year with data -> this year. Period picker: that year's weeks/months, newest first.
  const firstYear = Math.min(...ALL.map((r) => g.key(r.Date)).filter(Boolean).map((k) => +k.slice(0, 4)), new Date().getFullYear());
  const years = []; for (let y = new Date().getFullYear(); y >= firstYear; y--) years.push(y);
  const selYear = +cur.slice(0, 4);
  $('#pYear').innerHTML = years.map((y) => `<option${y === selYear ? ' selected' : ''}>${y}</option>`).join('');
  $('#pPeriodLbl').textContent = g.pick;
  $('#pPeriod').innerHTML = g.inYear(selYear).map((k) =>
    `<option value="${k}"${k === cur ? ' selected' : ''}>${g.long(k)} · ${fmt(counts[k] || 0)} review${counts[k] === 1 ? '' : 's'}</option>`).join('');
  $('#grainHint').textContent = (GRAIN === 'week' ? 'Weeks run Monday–Sunday · charts show the 12 weeks to the selected week' : 'Charts show the 12 months to the selected month')
    + (isLive ? ` · this ${g.noun} is still in progress` : '');

  const vsPrev = (n) => `<small>vs ${fmt(n)} prev ${g.noun}</small>`;
  $('#kpiAvgLbl').textContent = (GRAIN === 'week' ? g.label(cur) : g.long(cur)) + ' average';
  $('#kpiAvg').innerHTML = sc.n ? `${(sc.sum / sc.n).toFixed(1)} <small>★ · ${fmt(sc.n)} review${sc.n === 1 ? '' : 's'}</small>` : '– <small>no reviews</small>';
  $('#kpiPos').innerHTML = `${fmt(sc.pos)} ${vsPrev(sp.pos)}`;
  $('#kpiNeg').innerHTML = `${fmt(sc.neg)} ${vsPrev(sp.neg)}`;
  $('#lblTrend').textContent = 'Reviews per ' + g.noun;
  $('#lblPlat').textContent = 'Average rating by platform · by ' + g.noun;
  ['lblInst', 'lblRep'].forEach((id) => {
    $('#' + id).textContent = `5-star reviews · ${$('#' + id).dataset.who} · by ${g.noun}` + (GRAIN === 'week' ? ' · last 12 weeks' : '');
  });
  $('#platMatrix').innerHTML = platformMonthMatrix(keys);
  $('#lblThemes').textContent = 'What reviews are about · by ' + g.noun;
  renderThemes(keys);
  $('#lblInstM').innerHTML = starMatrix('installer');
  $('#lblRepM').innerHTML = starMatrix('rep');
  drawTrend(keys, keys.map((k) => counts[k] || 0), keys.map((k) => fives[k] || 0));
  requestAnimationFrame(() => document.querySelectorAll('.matrix-wrap.auto-right').forEach((el) => { el.scrollLeft = el.scrollWidth; }));
}

function renderShowroomTable() {
  const agg = {};
  ALL.forEach((r) => {
    const s = (r.Showroom || '').trim(); if (!s) return;
    const a = agg[s] || (agg[s] = { name: s, count: 0, sum: 0, five: 0 });
    a.count++; a.sum += num(r.Rating);
    if (Math.round(num(r.Rating)) === 5) a.five++;
  });
  let rows = Object.values(agg);
  if (!rows.length) { $('#showroomTable').innerHTML = '<div class="card"><div class="muted">No showroom-tagged reviews yet (Google reviews carry a showroom).</div></div>'; return; }
  const getVal = (r, k) => k === 'name' ? r.name.toLowerCase() : k === 'avg' ? r.sum / r.count : k === 'fivepct' ? r.five / r.count : r[k];
  rows.sort((a, b) => { const va = getVal(a, shSort.key), vb = getVal(b, shSort.key); return (va < vb ? -1 : va > vb ? 1 : 0) * shSort.dir; });
  const arrow = (k) => shSort.key === k ? (shSort.dir === 1 ? ' ▲' : ' ▼') : '';
  const th = (k, label, cls) => `<th class="sortable ${cls || ''}" data-k="${k}">${label}${arrow(k)}</th>`;
  $('#showroomTable').innerHTML = '<div class="matrix-wrap"><table class="matrix"><thead><tr>'
    + th('name', 'Showroom', 'sticky-col') + th('count', 'Reviews') + th('avg', 'Avg') + th('five', '5★') + th('fivepct', '5★ %')
    + '</tr></thead><tbody>'
    + rows.map((r) => `<tr>
        <td class="sticky-col">${esc(r.name)}</td>
        <td>${fmt(r.count)}</td>
        <td>${(r.sum / r.count).toFixed(1)}</td>
        <td>${fmt(r.five)}</td>
        <td>${Math.round(r.five / r.count * 100)}%</td>
      </tr>`).join('')
    + '</tbody></table></div>';
  $('#showroomTable').querySelectorAll('th.sortable').forEach((el) => el.addEventListener('click', () => {
    const k = el.dataset.k;
    if (shSort.key === k) shSort.dir *= -1; else { shSort.key = k; shSort.dir = (k === 'name') ? 1 : -1; }
    renderShowroomTable();
  }));
}

// Themes x periods for negative or positive reviews, with a recent-vs-prior trend on share.
function renderThemes(keys) {
  const g = GRAINS[GRAIN], neg = THEME_POL === 'neg';
  const base = {}, cell = {};
  ALL.forEach((r) => {
    const rt = num(r.Rating); if (!rt || (rt < 4) !== neg) return;
    const k = g.key(r.Date); if (!k) return;
    base[k] = (base[k] || 0) + 1;
    r._themes.forEach((t) => { const c = cell[t] || (cell[t] = {}); c[k] = (c[k] || 0) + 1; });
  });
  const cnt = (t, k) => (cell[t] || {})[k] || 0;
  const winTot = (t) => keys.reduce((s, k) => s + cnt(t, k), 0);
  // share of that period's negative (or positive) reviews mentioning the theme, pooled over several periods
  const pooled = (t, ks) => { const b = ks.reduce((s, k) => s + (base[k] || 0), 0); return b ? ks.reduce((s, k) => s + cnt(t, k), 0) / b : null; };
  const recent = keys.slice(-3), before = keys.slice(-6, -3);
  const noun = neg ? 'negative' : 'positive', tint = neg ? 'var(--red)' : 'var(--good)';
  const showVal = (c, b) => THEME_MODE === 'share' ? (b ? Math.round(c / b * 100) + '%' : '') : (c || '');
  const trendCell = (t) => {
    const a = pooled(t, recent), b = pooled(t, before);
    const nA = recent.reduce((s, k) => s + (base[k] || 0), 0), nB = before.reduce((s, k) => s + (base[k] || 0), 0);
    if (a == null || b == null || nA < 10 || nB < 10) return `<td class="muted" title="Too few ${noun} reviews to call a trend (${nB} then ${nA})">–</td>`;
    const d = Math.round((a - b) * 100);
    if (Math.abs(d) < 3) return `<td class="trend muted" title="${Math.round(b * 100)}% → ${Math.round(a * 100)}%">→ steady</td>`;
    const worse = neg ? d > 0 : d < 0;
    return `<td class="trend ${worse ? 'avg-lo' : 'avg-hi'}" title="${Math.round(b * 100)}% → ${Math.round(a * 100)}% of ${noun} reviews">${d > 0 ? '▲' : '▼'} ${Math.abs(d)} pts ${worse ? 'worse' : 'better'}</td>`;
  };
  $('#themePol').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.p === THEME_POL));
  $('#themeMode').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.m === THEME_MODE));
  const rows = THEMES.map(([n]) => n).sort((a, b) => winTot(b) - winTot(a));
  $('#themeMatrix').innerHTML = '<div class="matrix-wrap auto-right"><table class="matrix"><thead><tr>'
    + `<th class="sticky-col">Theme</th>` + keys.map((k) => `<th>${g.label(k)}</th>`).join('')
    + `<th class="tot">12-${g.noun === 'week' ? 'wk' : 'mth'} total</th><th title="Share of ${noun} reviews mentioning the theme: last 3 ${g.noun}s vs the 3 before">Last 3 vs prior 3</th></tr></thead><tbody>`
    + `<tr><td class="sticky-col">All ${noun} reviews</td>` + keys.map((k) => `<td class="tot">${base[k] || ''}</td>`).join('')
    + `<td class="tot">${keys.reduce((s, k) => s + (base[k] || 0), 0)}</td><td></td></tr>`
    + rows.map((t) => `<tr class="theme-row" data-t="${esc(t)}"><td class="sticky-col">${esc(t)}</td>`
        + keys.map((k) => {
            const c = cnt(t, k), b = base[k] || 0, s = b ? c / b : 0;
            return `<td style="${c ? `background:color-mix(in srgb, ${tint} ${Math.round(s * 55)}%, #fff)` : ''}" title="${c} of ${b} ${noun} review${b === 1 ? '' : 's'}${b ? ' (' + Math.round(s * 100) + '%)' : ''}">${showVal(c, b)}</td>`;
          }).join('')
        + `<td class="tot">${winTot(t)}</td>` + trendCell(t) + '</tr>').join('')
    + '</tbody></table></div>';
  $('#themeMatrix').querySelectorAll('tr.theme-row').forEach((tr) => tr.addEventListener('click', () => {
    $('#fTheme').value = tr.dataset.t;
    $('#fRating').value = neg ? 'neg' : '4';
    renderFeed();
    $('#fTheme').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
}

function renderFeed() {
  const src = $('#fSource').value, sh = $('#fShowroom').value, rt = $('#fRating').value, st = $('#fStaff').value;
  const q = $('#fSearch').value.trim().toLowerCase();
  let rows = ALL.slice().sort((a, b) => dateVal(b.Date) - dateVal(a.Date));
  if (src) rows = rows.filter((r) => r.Source === src);
  if (sh) rows = rows.filter((r) => (r.Showroom || '').trim() === sh);
  if (rt === '5') rows = rows.filter((r) => Math.round(num(r.Rating)) === 5);
  else if (rt === '4') rows = rows.filter((r) => num(r.Rating) >= 4);
  else if (rt === 'neg') rows = rows.filter((r) => num(r.Rating) < 4 && num(r.Rating) > 0);
  else if (rt === 'low') rows = rows.filter((r) => num(r.Rating) <= 2 && num(r.Rating) > 0);
  const th = $('#fTheme').value;
  if (th) rows = rows.filter((r) => r._themes.includes(th));
  if (st === 'named') rows = rows.filter((r) => r._staff.length);
  const role = $('#fRole').value;
  if (role) rows = rows.filter((r) => r._staff.some((n) => roleOf(n) === role));
  if (q) rows = rows.filter((r) => ((r.Review || '') + ' ' + (r.Title || '') + ' ' + r._staff.join(' ') + ' ' + (r.Author || '') + ' ' + (r.Showroom || '')).toLowerCase().includes(q));

  const shown = rows.slice(0, 60);
  const bClass = (s) => 'b-' + String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  $('#feed').innerHTML = (shown.length ? shown.map((r) => {
    const flagged = r._staff.join(', ');
    const when = r.Date ? new Date(r.Date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    return `<div class="review ${flagged ? 'flag' : ''}">
      <div class="meta">
        <span class="badge ${bClass(r.Source)}">${esc(r.Source)}</span>
        ${r.Showroom ? `<span class="badge b-showroom">${esc(r.Showroom)}</span>` : ''}
        <span class="stars">${stars(r.Rating)}</span>
        <span class="who">${esc(r.Author || 'Anonymous')}${when ? ' · ' + when : ''}</span>
        ${flagged ? `<span class="staff"><i>◆</i> ${esc(flagged)}</span>` : ''}
      </div>
      ${r.Title ? `<div class="body" style="font-weight:600;">${esc(r.Title)}</div>` : ''}
      <div class="body">${esc(r.Review || '')}</div>
      ${r._themes.length ? `<div class="tags">${r._themes.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${r['Business Reply'] ? `<div class="reply">${esc(r['Business Reply'])}</div>` : ''}
      ${r.URL ? `<div style="margin-top:6px;"><a class="rev-link" href="${esc(r.URL)}" target="_blank" rel="noopener">View original ↗</a></div>` : ''}
    </div>`;
  }).join('') : '<div class="muted" style="padding:12px 0;">No reviews match those filters.</div>')
    + (rows.length > shown.length ? `<div class="muted" style="padding:8px 0;">Showing 60 of ${fmt(rows.length)} — narrow with filters above.</div>` : '');
}

function platformMonthMatrix(monthKeys) {
  const g = GRAINS[GRAIN];
  const sources = [...new Set(ALL.map((r) => r.Source).filter(Boolean))];
  if (!sources.length || !monthKeys.length) return '<div class="card"><div class="muted">Not enough data yet.</div></div>';
  const cell = {};      // source -> monthKey -> { sum, cnt }
  const overall = {};   // source -> { sum, cnt }  (all-time)
  ALL.forEach((r) => {
    const s = r.Source, rt = num(r.Rating); if (!s || !rt) return;
    (overall[s] = overall[s] || { sum: 0, cnt: 0 }); overall[s].sum += rt; overall[s].cnt++;
    const mk = g.key(r.Date); if (!mk) return;
    (cell[s] = cell[s] || {}); (cell[s][mk] = cell[s][mk] || { sum: 0, cnt: 0 });
    cell[s][mk].sum += rt; cell[s][mk].cnt++;
  });
  const mLabel = g.label;
  const band = (a) => a >= 4.5 ? 'avg-hi' : a >= 3.5 ? 'avg-mid' : 'avg-lo';
  const avgOf = (o) => (o && o.cnt) ? o.sum / o.cnt : null;
  return '<div class="matrix-wrap"><table class="matrix"><thead><tr>'
    + '<th class="sticky-col">Platform</th><th class="tot">All-time</th>'
    + monthKeys.map((k) => `<th>${mLabel(k)}</th>`).join('') + '</tr></thead><tbody>'
    + sources.map((s) => {
        const ov = avgOf(overall[s]);
        return `<tr><td class="sticky-col">${esc(s)}</td>`
          + `<td class="tot" title="${overall[s] ? overall[s].cnt : 0} reviews">${ov != null ? ov.toFixed(1) : ''}</td>`
          + monthKeys.map((k) => {
              const o = (cell[s] || {})[k], a = avgOf(o);
              return a != null ? `<td class="${band(a)}" title="${o.cnt} review${o.cnt === 1 ? '' : 's'}">${a.toFixed(1)}</td>` : '<td></td>';
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

function starMatrix(roleTarget) {
  const g = GRAINS[GRAIN];
  const recent = GRAIN === 'week' ? new Set(lastPeriods('week')) : null;
  const fives = ALL.filter((r) => Math.round(num(r.Rating)) === 5 && r._staff.length);
  const cell = {}, totals = {}, monthsSet = {};
  fives.forEach((r) => {
    const mk = g.key(r.Date); if (!mk || (recent && !recent.has(mk))) return;
    r._staff.forEach((nm) => {
      if (roleTarget && roleOf(nm) !== roleTarget) return;
      monthsSet[mk] = true;
      (cell[nm] = cell[nm] || {})[mk] = ((cell[nm] || {})[mk] || 0) + 1;
      totals[nm] = (totals[nm] || 0) + 1;
    });
  });
  const staff = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  if (!staff.length) return '<div class="card"><div class="muted">' + (recent ? 'No 5-star reviews have mentioned a staff member in the last 12 weeks.' : 'No 5-star reviews mention a staff member yet.') + '</div></div>';
  const months = recent ? lastPeriods('week') : Object.keys(monthsSet).sort();   // oldest -> newest (left -> right)
  const mLabel = g.label;
  return '<div class="matrix-wrap auto-right"><table class="matrix"><thead><tr>'
    + '<th class="sticky-col">Staff</th>'
    + months.map((k) => `<th>${mLabel(k)}</th>`).join('')
    + `<th class="tot">${recent ? '12-wk total' : 'Total'}</th></tr></thead><tbody>`
    + staff.map((nm) => `<tr><td class="sticky-col">${esc(nm)}</td>`
        + months.map((k) => { const v = (cell[nm] || {})[k]; return v ? `<td class="hit">${v}</td>` : '<td></td>'; }).join('')
        + `<td class="tot">${totals[nm]}</td>`
        + '</tr>').join('')
    + '</tbody></table></div>';
}

let trendChart;
function drawTrend(labels, totals, fives) {
  const ctx = $('#trend'); if (!ctx) return;
  if (trendChart) trendChart.destroy();
  const pretty = labels.map(GRAINS[GRAIN].label);
  const others = totals.map((t, i) => Math.max(0, t - fives[i]));
  trendChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: pretty, datasets: [
      { label: '5-star', data: fives, backgroundColor: '#da487e', stack: 's', maxBarThickness: 34 },
      { label: 'Other', data: others, backgroundColor: '#f2cbdb', stack: 's', borderRadius: 4, maxBarThickness: 34 },
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: {
          label: (c) => {
            const t = totals[c.dataIndex], f = fives[c.dataIndex];
            if (c.dataset.label === '5-star') return '5-star: ' + f + ' (' + (t ? Math.round(f / t * 100) : 0) + '%)';
            return 'Other: ' + Math.max(0, t - f);
          },
          footer: (items) => 'Total: ' + totals[items[0].dataIndex],
        } } },
      scales: { x: { stacked: true, grid: { display: false }, ticks: { color: '#736c67', font: { size: 11 } } },
        y: { stacked: true, beginAtZero: true, grid: { color: '#e8e6e5' }, ticks: { color: '#736c67', font: { size: 11 }, precision: 0 } } } },
  });
}
</script>
